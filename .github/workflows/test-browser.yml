name: Browser Tests
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  tests:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v6

      - name: Setup Node 26.x
        uses: https://github.com/actions/setup-node@v6
        with:
          node-version: latest

      - name: Setup Bun
        uses: https://github.com/oven-sh/setup-bun@v2

      - name: Install playwright dependencies
        run: bun install @playwright/test@latest

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Start testserver
        run: bun tests/test-browser-server.js &

      - name: Run Playwright tests
        run: bun playwright test

      - uses: https://github.com/actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
