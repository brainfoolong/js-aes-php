name: Browser Tests
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x

      - name: Install playwright dependencies
        run: bun install @playwright/test@latest

      - name: Install Playwright Browsers
        run: bun --yes playwright install >> /dev/null 2>&1

      - name: Start testserver
        run: bun tests/test-browser-server.js &

      - name: Run Playwright tests
        run: bun playwright test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
