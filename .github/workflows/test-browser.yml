name: Browser Tests
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  tests:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    # Tell Forgejo to run the whole job inside the Playwright image
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: https://github.com/actions/checkout@v6

      - name: Start testserver
        run: node tests/test-browser-server.js &

      - name: Run Playwright tests
        # Since we are already IN the container, we just run the commands directly
        run: |
          cd tests
          npm i --yes -D @playwright/test@1.59.1
          npx --yes playwright test