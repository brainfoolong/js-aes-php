name: Mirror from Codeberg

on:
  # Allows triggering via an external webhook
  repository_dispatch:
    types: [sync-codeberg]
  # Allows you to run this workflow manually from the GitHub Actions tab
  workflow_dispatch:
  # OPTIONAL: Uncomment the lines below to automatically sync every hour as a fallback
  schedule:
    - cron: '0 * * * *'

env:
  CODEBERG_REPO_URL: 'https://codeberg.org/BrainFooLong/js-aes-php.git'
  BRANCH_NAME: 'main'

jobs:
  sync:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Required to rewrite history and force push
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Add Codeberg remote and fetch
        run: |
          git remote add codeberg ${{ env.CODEBERG_REPO_URL }}
          git fetch codeberg ${{ env.BRANCH_NAME }}

      - name: Reset to Codeberg state
        run: |
          # Configure git as the GitHub Actions bot
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Hard reset the GitHub branch to exactly match the Codeberg branch
          git reset --hard codeberg/${{ env.BRANCH_NAME }}

      - name: Enforce only mirror workflow
        run: |
          # Delete any test workflows that came from Codeberg
          rm -rf .github/workflows/test-*

      - name: Prepend mirror notice to README
        run: |
          NOTICE="> **Note:** This is a mirror, please visit [Codeberg](${{ env.CODEBERG_REPO_URL }}) for actual development.\n\n"
          
          if [ -f README.md ]; then
            # Prepend the notice safely using a temporary file
            echo -e "$NOTICE" | cat - README.md > temp_readme && mv temp_readme README.md
          else
            echo -e "$NOTICE" > README.md
          fi

      - name: Commit and Force Push to GitHub
        run: |
          git add README.md
          
          # Commit the modified README (will gracefully skip if no changes exist)
          git commit -m "chore: sync mirror and update README [skip ci]" || echo "No changes to commit"
          
          # Force push is required because we rewrite the top commit every time it syncs
          git push --force origin HEAD:${{ env.BRANCH_NAME }}